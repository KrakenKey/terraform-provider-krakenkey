# Builds and signs a release when a v* tag is pushed. The signing subkey and
# its passphrase are in Bitwarden Secrets Manager; the "release" environment
# holds the BWS_ACCESS_TOKEN that reads them, the BWS_* variables with their
# secret ids, and GPG_SIGNING_SUBKEY (the subkey fingerprint).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Load the signing key from Bitwarden
        id: secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BWS_TF_SIGNING_KEY_ID }} > GPG_PRIVATE_KEY
            ${{ vars.BWS_TF_SIGNING_PASSPHRASE_ID }} > GPG_PASSPHRASE

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ steps.secrets.outputs.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ steps.secrets.outputs.GPG_PASSPHRASE }}
          GPG_SIGNING_SUBKEY: ${{ vars.GPG_SIGNING_SUBKEY }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: scripts/import-signing-key.sh

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_SIGNING_SUBKEY: ${{ vars.GPG_SIGNING_SUBKEY }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
